name: Generate ascii artifact
on:
    push
jobs:
    build-job1:
        runs-on: ubuntu-latest
        steps:
            - name: install cowsay program
              run: sudo apt-get install cowsay -y
            
            - name: Excecute cowsay CMD
              run: cowsay -f dragon "I am a dragon" >> dragon.txt
            
            - name: sleep for 30 seconds
              run: sleep 30
    
    test-job2:
        runs-on: ubuntu-latest
        steps:
            - name: sleep for 10 seconds
              run: sleep 10

            - name: Text file exists
              run: grep -i "dragon" dragon.txt

    deploy-job3:
        runs-on: ubuntu-latest
        steps:
            - name: Raead file
              run: cat dragon.txt
            
            - name: Deploy docker
              run: echo "Deploying....."
